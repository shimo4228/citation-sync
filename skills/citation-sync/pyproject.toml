[project]
name = "citation-sync"
version = "0.1.0"
description = "Audit the three citation layers of research repos (docs / .zenodo.json / graph.jsonld) and report divergence. Read-only."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]
markers = [
  "unit: fast pure-python unit tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# root ruff.toml と同じ明示 select。sub-project 化する前この script は root 設定で
# lint されていたので、pyproject を足したことでゲートの rule set が黙って
# 入れ替わらないよう同じ集合を pin する (根拠は root ruff.toml の冒頭コメント)。
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C901"]

[tool.ruff.lint.mccabe]
# 予算は **上げずに刈る** (ADR-0056、閾値と実測分布の as-of は .claude/verify.md)。
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
# `urllib.error.HTTPError(..., hdrs, ...)` は typeshed が `email.message.Message` を要求
# するが、実行時は dict を受け、テストは HTTP エラーの再現にしか使っていない。
# 2026-08-28、ty 0.0.75 導入時。解除条件: typeshed が dict を受け入れるようになったとき。
invalid-argument-type = "ignore"
